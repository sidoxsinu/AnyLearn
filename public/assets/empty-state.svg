<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="empty-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F7F7" />
      <stop offset="100%" stop-color="#F0F0F0" />
    </linearGradient>
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5F1F7" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE8B0" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Dashed outer pastel boundary -->
  <rect x="40" y="30" width="320" height="240" rx="32" fill="url(#empty-card-bg)" stroke="#0A0A0A" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="8 8" filter="url(#shadow-card)" />

  <!-- Center floating badge in mint -->
  <rect x="150" y="80" width="100" height="100" rx="28" fill="#CFF7D3" />

  <!-- 3D Open book illustration -->
  <path d="M165 140 Q180 135 200 138 Q220 135 235 140 L235 110 Q220 105 200 108 Q180 105 165 110 Z" fill="#FFFFFF" />
  <path d="M165 142 Q180 137 200 140 Q220 137 235 142" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" fill="none" />
  <line x1="200" y1="108" x2="200" y2="140" stroke="#0A0A0A" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Sparkles -->
  <path d="M265 75 Q265 85 255 87 Q265 87 265 97 Q265 87 275 87 Q265 85 265 75 Z" fill="url(#spark-grad)" />
  <path d="M135 155 Q135 163 127 165 Q135 165 135 173 Q135 165 143 165 Q135 163 135 155 Z" fill="#F1D3FA" />

  <!-- Typography placeholder lines -->
  <rect x="120" y="200" width="160" height="12" rx="6" fill="#0A0A0A" fill-opacity="0.8" />
  <rect x="150" y="222" width="100" height="8" rx="4" fill="#0A0A0A" fill-opacity="0.3" />
</svg>
