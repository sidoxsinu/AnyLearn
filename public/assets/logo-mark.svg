<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFF7D3" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <linearGradient id="logo-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D3FA" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark pill background -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="#0A0A0A" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Graduation cap diamond in pastel mint -->
  <path d="M24 10 L38 18 L24 26 L10 18 Z" fill="url(#logo-grad-1)" filter="url(#logo-glow)" />

  <!-- Cap base curve in lavender -->
  <path d="M15 21.5 V27 C15 32 33 32 33 27 V21.5 L24 27 Z" fill="url(#logo-grad-2)" />

  <!-- Center pearl -->
  <circle cx="24" cy="18" r="2" fill="#0A0A0A" />

  <!-- Tassel in butter -->
  <path d="M24 18 Q29 21 31 28" stroke="#FBE8B0" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="31" cy="28.5" r="1.5" fill="#FBE8B0" />
</svg>
